name: Build and Release Resource Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create resource pack ZIP
        run: |
          zip -r resource-pack.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tools/*" \
            -x "resource-pack.zip" \
            -x "*.sha1"

      - name: Calculate SHA1
        run: |
          sha1sum resource-pack.zip | awk '{print $1}' > resource-pack.zip.sha1

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: |
            resource-pack.zip
            resource-pack.zip.sha1

  latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download resource pack
        uses: actions/download-artifact@v4
        with:
          name: resource-pack

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resource Pack
          body: |
            Automatically built from the latest commit on `main`.

            Download: https://github.com/${{ github.repository }}/releases/latest/download/resource-pack.zip
          make_latest: true
          files: |
            resource-pack.zip
            resource-pack.zip.sha1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download resource pack
        uses: actions/download-artifact@v4
        with:
          name: resource-pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Resource Pack ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          files: |
            resource-pack.zip
            resource-pack.zip.sha1
